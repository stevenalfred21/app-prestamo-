<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Préstamos</title>
  <meta name="description" content="Control de préstamos con rédito quincenal">
  <meta name="theme-color" content="#0f7a5a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Préstamos">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="barra">
    <button id="btn-atras" class="icono" aria-label="Atrás" hidden>&#8249;</button>
    <h1 id="titulo">Préstamos</h1>
  </header>

  <main id="vista"></main>

  <nav class="tabs">
    <a href="#/" data-tab="resumen">Resumen</a>
    <a href="#/cobros" data-tab="cobros">Cobros</a>
    <a href="#/clientes" data-tab="clientes">Clientes</a>
    <a href="#/ajustes" data-tab="ajustes">Ajustes</a>
  </nav>

  <dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
  <div id="aviso" role="status"></div>

  <div id="bloqueo" hidden>
    <form id="form-pin" autocomplete="off">
      <div class="candado">$</div>
      <h2>Préstamos</h2>
      <p class="suave">Escribe tu PIN para entrar</p>
      <input id="pin-entrada" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" aria-label="PIN">
      <p class="rojo" id="pin-error" hidden>PIN incorrecto</p>
      <button type="submit" class="btn primario bloque">Entrar</button>
      <button type="button" class="btn bloque" id="pin-olvido" style="margin-top:8px">Olvidé mi PIN</button>
    </form>
  </div>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
