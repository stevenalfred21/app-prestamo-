# Compila el APK de Android y el instalador de Windows, y los publica en una Release del repositorio.
name: Instaladores

on:
  push:
    branches: [main, claude/prestamos-pwa-app-ic0gd8]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Prestamos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Prestamos.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - name: Renombrar instalador
        shell: bash
        run: cp dist/*.exe Prestamos-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Prestamos-Windows.exe

  publicar:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Préstamos 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            Prestamos.apk
            Prestamos-Windows.exe
          body: |
            - **Android:** descarga `Prestamos.apk` desde el celular y ábrelo.
            - **Windows:** descarga `Prestamos-Windows.exe` y ejecútalo.
            - **iPhone:** abre la versión web en Safari y usa Compartir → Agregar a inicio.
